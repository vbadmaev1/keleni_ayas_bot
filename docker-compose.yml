services:
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ASR_ENABLED: ${ASR_ENABLED:-1}
      ASR_LM_ENABLED: ${ASR_LM_ENABLED:-1}
      ASR_MAX_SEC: ${ASR_MAX_SEC:-240}
      ASR_MAX_MB: ${ASR_MAX_MB:-20}
      ASR_THREADS: ${ASR_THREADS:-2}
      ASR_USER_COOLDOWN: ${ASR_USER_COOLDOWN:-20}
      ASR_USER_DAILY: ${ASR_USER_DAILY:-20}
      ASR_QUEUE: ${ASR_QUEUE:-2}
      ASR_MIN_FREE_MB: ${ASR_MIN_FREE_MB:-1500}
      ASR_LM_MIN_FREE_MB: ${ASR_LM_MIN_FREE_MB:-256}
      ASR_IDLE_UNLOAD: ${ASR_IDLE_UNLOAD:-600}
    volumes:
      - ./data:/data
